name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: "https://salsa-explosion-bkgf.vercel.app"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?pgbouncer=true"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
      CLERK_SECRET_KEY: "sk_test_placeholder"
      CLERK_WEBHOOK_SECRET: "whsec_placeholder"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      ALLOW_DEMO_ROLE_SWITCHING: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Verification
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
